name: Release

# Runs only when a version tag (v1.0.0, ...) is pushed. Builds the binary for
# five targets on GitHub's machines and attaches them, with SHA-256 sums, to
# a draft release that the owner reviews and publishes by hand.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, ext: "" }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, ext: "" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, ext: ".exe" }
          - { os: macos-latest, target: aarch64-apple-darwin, ext: "" }
          - { os: macos-13, target: x86_64-apple-darwin, ext: "" }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add ${{ matrix.target }}
          if [[ "${{ matrix.target }}" == *musl ]]; then sudo apt-get update && sudo apt-get install -y musl-tools; fi
      - name: Tests
        run: cargo test --release
      - name: Build
        run: cargo build --release --locked --bin wqfm-rs --target ${{ matrix.target }}
      - name: Build the desktop app (native target; it needs the system's graphics libraries)
        run: cargo build --release --locked --bin wqfm-rs-gui
      - name: Package
        run: |
          name="wqfm-rs-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/wqfm-rs${{ matrix.ext }}" LICENSE NOTICE README.md CITATION.cff "$name/"
          cp "target/release/wqfm-rs-gui${{ matrix.ext }}" "$name/"
          if [ "${{ matrix.ext }}" = ".exe" ]; then 7z a "$name.zip" "$name" > /dev/null; else tar -czf "$name.tar.gz" "$name"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: wqfm-rs-*.*z*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Checksums
        run: sha256sum wqfm-rs-* > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            wqfm-rs-*
            SHA256SUMS
