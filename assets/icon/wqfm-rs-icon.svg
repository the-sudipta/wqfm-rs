<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="t">
  <title id="t">wQFM-rs: a weighted quartet ab|cd</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1B33"/>
      <stop offset="1" stop-color="#103B55"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.46" r="0.62">
      <stop offset="0" stop-color="#2A8FA8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#2A8FA8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="weight" gradientUnits="userSpaceOnUse" x1="188" y1="0" x2="324" y2="0">
      <stop offset="0" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#EA580C"/>
    </linearGradient>
    <radialGradient id="left" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#99F6E4"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </radialGradient>
    <radialGradient id="right" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#C7D2FE"/>
      <stop offset="1" stop-color="#6366F1"/>
    </radialGradient>
  </defs>

  <!-- tile -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="4"/>

  <!-- the two sister pairs -->
  <g stroke="#E2E8F0" stroke-width="22" stroke-linecap="round" fill="none">
    <path d="M188 256 L108 156"/>
    <path d="M188 256 L108 356"/>
    <path d="M324 256 L404 156"/>
    <path d="M324 256 L404 356"/>
  </g>

  <!-- the weighted middle edge (the split ab|cd) -->
  <path d="M188 256 L324 256" stroke="url(#weight)" stroke-width="40" stroke-linecap="round"/>

  <!-- inner nodes -->
  <circle cx="188" cy="256" r="20" fill="#E2E8F0"/>
  <circle cx="324" cy="256" r="20" fill="#E2E8F0"/>

  <!-- leaves: left side and right side of the bipartition -->
  <g stroke="#0B1B33" stroke-width="8">
    <circle cx="108" cy="156" r="44" fill="url(#left)"/>
    <circle cx="108" cy="356" r="44" fill="url(#left)"/>
    <circle cx="404" cy="156" r="44" fill="url(#right)"/>
    <circle cx="404" cy="356" r="44" fill="url(#right)"/>
  </g>
</svg>
