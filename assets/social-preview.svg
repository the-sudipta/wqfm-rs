<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1B33"/>
      <stop offset="1" stop-color="#103B55"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.25" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#2A8FA8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2A8FA8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="weight" gradientUnits="userSpaceOnUse" x1="188" y1="0" x2="324" y2="0">
      <stop offset="0" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#EA580C"/>
    </linearGradient>
    <radialGradient id="left" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#99F6E4"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </radialGradient>
    <radialGradient id="right" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#C7D2FE"/>
      <stop offset="1" stop-color="#6366F1"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <!-- the icon's quartet, without its tile, scaled to 0.78 -->
  <g transform="translate(120 120) scale(0.78)">
    <g stroke="#E2E8F0" stroke-width="22" stroke-linecap="round" fill="none">
      <path d="M188 256 L108 156"/><path d="M188 256 L108 356"/>
      <path d="M324 256 L404 156"/><path d="M324 256 L404 356"/>
    </g>
    <path d="M188 256 L324 256" stroke="url(#weight)" stroke-width="40" stroke-linecap="round"/>
    <circle cx="188" cy="256" r="20" fill="#E2E8F0"/><circle cx="324" cy="256" r="20" fill="#E2E8F0"/>
    <g stroke="#0B1B33" stroke-width="8">
      <circle cx="108" cy="156" r="44" fill="url(#left)"/><circle cx="108" cy="356" r="44" fill="url(#left)"/>
      <circle cx="404" cy="156" r="44" fill="url(#right)"/><circle cx="404" cy="356" r="44" fill="url(#right)"/>
    </g>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="600" y="270" font-size="104" font-weight="700" fill="#F8FAFC">wQFM-rs</text>
    <text x="604" y="338" font-size="34" fill="#CBD5E1">Exact, fast weighted quartet amalgamation</text>
    <text x="604" y="384" font-size="34" fill="#CBD5E1">for species trees, in Rust</text>
    <text x="604" y="468" font-size="26" fill="#FBBF24">Same trees as wQFM v1.4 · Linux · macOS · Windows</text>
  </g>
